<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="0.55" stop-color="#2f3fd6"/>
      <stop offset="1" stop-color="#1c1f7a"/>
    </linearGradient>
    <radialGradient id="glanz" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#e5484d"/></linearGradient>
    <linearGradient id="gelb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
    <linearGradient id="gruen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ff0a8"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b0f3a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hintergrund (randlos, damit auch als maskierbares Icon nutzbar) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glanz)"/>

  <!-- Balken: rot, gelb, grün wie der Farbverlauf in der App -->
  <g filter="url(#schatten)">
    <rect x="150" y="318" width="56" height="78" rx="14" fill="url(#rot)"/>
    <rect x="228" y="270" width="56" height="126" rx="14" fill="url(#gelb)"/>
    <rect x="306" y="214" width="56" height="182" rx="14" fill="url(#gruen)"/>
  </g>

  <!-- Abschlusshut auf dem höchsten Balken -->
  <g filter="url(#schatten)" transform="translate(334 168) rotate(-12)">
    <path d="M-66 18 V44 C-66 62 66 62 66 44 V18 L0 44 Z" fill="#e8ecff"/>
    <path d="M0 -26 L96 12 L0 50 L-96 12 Z" fill="#ffffff"/>
    <path d="M0 12 L72 22 V64" fill="none" stroke="#ffd36b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="70" r="9" fill="#ffd36b"/>
    <circle cx="0" cy="12" r="7" fill="#c7d0ff"/>
  </g>

  <!-- Funkeln -->
  <path d="M150 150 l7 -20 l7 20 l20 7 l-20 7 l-7 20 l-7 -20 l-20 -7 z" fill="#ffffff" opacity="0.9"/>
  <path d="M206 108 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 z" fill="#ffffff" opacity="0.6"/>
</svg>
